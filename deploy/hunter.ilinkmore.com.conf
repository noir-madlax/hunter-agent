upstream hunter_agent_server {
    server 127.0.0.1:3003 weight=1;
}

server {
    listen 80;
    server_name hunter.ilinkmore.com;
    access_log /opt/logs/nginx/hunter.ilinkmore.com.access.log main;
    error_log /opt/logs/nginx/hunter.ilinkmore.com.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/hunter-agent/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name hunter.ilinkmore.com;
    access_log /opt/logs/nginx/hunter.ilinkmore.com.ssl.access.log main;
    error_log /opt/logs/nginx/hunter.ilinkmore.com.ssl.error.log;

    ssl_certificate /etc/nginx/ssl/hunter.ilinkmore.com.pem;
    ssl_certificate_key /etc/nginx/ssl/hunter.ilinkmore.com.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100m;

    location / {
        proxy_pass http://hunter_agent_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
